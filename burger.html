<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Burger Menu - Cafe & Deli</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

<h2>🍔 Burger Menu</h2>

<a href="order.html" style="color:white;text-decoration:none;">
⬅ Back
</a>

</header>


<section class="hero">


<div class="menu-card">

<img src="hero.jpg" alt="Burger">

<h2>Single Burger</h2>

<p>$3.99</p>

<button class="btn orange" onclick="addToCart('Single Burger','$3.99')">
🛒 Add to Cart
</button>

</div>



<div class="menu-card">

<img src="hero.jpg" alt="Burger">

<h2>Double Burger</h2>

<p>$5.49</p>

<button class="btn orange" onclick="addToCart('Double Burger','$5.49')">
🛒 Add to Cart
</button>

</div>



<div class="menu-card">

<img src="single-burger.jpg" alt="Single Burger">

<h2>Chicken B Sandwich</h2>

<p>$5.99</p>

<button class="btn orange" onclick="addToCart('Chicken B Sandwich','$5.99')">
🛒 Add to Cart
</button>

</div>


</section>


<a class="cart-btn" onclick="sendWhatsApp()">
🛒 Send Order
</a>


<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name, price){

cart.push({
item:name,
price:price
});

localStorage.setItem("cart", JSON.stringify(cart));

alert(name + " added to cart");

}


function sendWhatsApp(){

if(cart.length == 0){

alert("Cart is empty");

return;

}


let message =
"Hello Cafe & Deli\n\nOrder:\n";


cart.forEach(function(product){

message += "• " + product.item + " " + product.price + "\n";

window.open(
"https://wa.me/967783301898?text=" + encodeURIComponent(message),
"_blank"
);

// مسح السلة
localStorage.removeItem("cart");
cart = [];

// الرجوع إلى صفحة الطلب
setTimeout(function(){
    window.location.href = "order.html";
}, 500);

}

</script>

</body>
</html>
