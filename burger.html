<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Burger Menu - Cafe & Deli</title>

<link rel="stylesheet" href="style.css">

</head>

<body>


<header class="navbar">

<h2>🍔 Burger Menu</h2>

<a href="order.html" style="color:white;text-decoration:none;">
⬅ Back
</a>

</header>



<section class="hero">

<div class="menu-card">

<img src="hero.jpg" alt="Burger">

<h2>Single Burger</h2>

<p>$3.99</p>

<button class="btn orange">
Add to Cart
</button>

</div>



<div class="menu-card">

<img src="hero.jpg" alt="Burger">

<h2>Double Burger</h2>

<p>$5.49</p>

<button class="btn orange" onclick="orderWhatsApp()">
🛒 Order via WhatsApp
</button>

<script>
function orderWhatsApp(){

let message =
"Hello Cafe & Deli\n\n" +
"Order: Single Burger\n" +
"Price: $3.99\n" +
"Quantity: 1";

window.open(
"https://wa.me/17576283836?text=" + encodeURIComponent(message),
"_blank"
);

}
</script>

</div>



<div class="menu-card">

<img src="hero.jpg" alt="Burger">

<h2>Chicken B Sandwich</h2>

<p>$5.99</p>

<button class="btn orange">
Add to Cart
</button>

</div>


</section>


</body>
</html>
