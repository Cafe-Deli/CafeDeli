<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafe & Deli Menu</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    text-align:center;
    font-family:Arial,sans-serif;
}

h1{
    margin:20px;
}

img{
    width:95%;
    max-width:900px;
    border-radius:12px;
    cursor:zoom-in;
    transition:.3s;
}

img:hover{
    transform:scale(1.02);
}

.overlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.overlay img{
    max-width:98%;
    max-height:98%;
    cursor:zoom-out;
}
</style>

</head>

<body>

<h1>📖 Cafe & Deli Menu</h1>

<img src="menu.jpg" onclick="openMenu()">

<div class="overlay" id="menu">
    <img src="menu.jpg" onclick="closeMenu()">
</div>

<script>
function openMenu(){
document.getElementById("menu").style.display="flex";
}

function closeMenu(){
document.getElementById("menu").style.display="none";
}
</script>

</body>
</html><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cafe & Deli Menu</title>

<style>
body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: 38px;
    margin: 30px 0;
}

.menu-container {
    display: flex;
    justify-content: center;
    padding: 20px;
}

.menu-container img {
    width: 95%;
    max-width: 900px;
    height: auto;
    border-radius: 10px;
    cursor: zoom-in;
    transition: transform 0.3s ease;
}

/* تكبير عند الضغط */
.menu-container img:active {
    transform: scale(1.5);
    cursor: zoom-out;
}

.back {
    display: inline-block;
    margin: 20px;
    padding: 12px 25px;
    background: #ff7a00;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 20px;
}
</style>

</head>

<body>

<h1>📖 Cafe & Deli Menu</h1>

<div class="menu-container">
<img src="menu.jpg" alt="Cafe & Deli Menu">
</div>

<a class="back" href="index.html">⬅ Back</a>

</body>
</html>
