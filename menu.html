<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafe & Deli Menu</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    text-align:center;
    font-family:Arial,sans-serif;
}

h1{
    margin:20px;
}

img{
    width:95%;
    max-width:900px;
    border-radius:12px;
    cursor:zoom-in;
    transition:.3s;
}

img:hover{
    transform:scale(1.02);
}

.overlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.overlay img{
    max-width:98%;
    max-height:98%;
    cursor:zoom-out;
}
</style>

</head>

<body>

<h1>📖 Cafe & Deli Menu</h1>

<img src="menu.jpg" onclick="openMenu()">

<div class="overlay" id="menu">
    <img src="menu.jpg" onclick="closeMenu()">
</div>

<script>
function openMenu(){
document.getElementById("menu").style.display="flex";
}

function closeMenu(){
document.getElementById("menu").style.display="none";
}
</script>

</body>
</html>
