<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cafe & Deli Menu</title>

<style>
body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: 38px;
    margin: 30px 0;
}

.menu-container {
    display: flex;
    justify-content: center;
    padding: 20px;
}

.menu-container img {
    width: 95%;
    max-width: 900px;
    height: auto;
    border-radius: 10px;
    cursor: zoom-in;
    transition: transform 0.3s ease;
}

/* تكبير عند الضغط */
.menu-container img:active {
    transform: scale(1.5);
    cursor: zoom-out;
}

.back {
    display: inline-block;
    margin: 20px;
    padding: 12px 25px;
    background: #ff7a00;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 20px;
}
</style>

</head>

<body>

<h1>📖 Cafe & Deli Menu</h1>

<div class="menu-container">
<img src="menu.jpg" alt="Cafe & Deli Menu">
</div>

<a class="back" href="index.html">⬅ Back</a>

</body>
</html>
